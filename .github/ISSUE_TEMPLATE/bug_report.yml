name: Bug Report
description: 버그를 제보합니다
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 설명
      description: 어떤 문제가 발생했나요?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 문제를 재현할 수 있는 단계를 알려주세요.
      placeholder: |
        1. `kvote nec corpus --normalize` 실행
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 어떻게 동작해야 하나요?
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: kvote version
      description: "`kvote version` 출력을 붙여넣어 주세요."
      placeholder: "kvote 0.1.0 (commit ..., built ...)"
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: kvote doctor 출력 (선택)
      description: "`kvote doctor` 결과를 붙여넣으면 어느 경로가 깨졌는지 빠르게 파악됩니다."
      render: shell
    validations:
      required: false
  - type: dropdown
    id: provider
    attributes:
      label: 관련 provider
      options:
        - "NEC (개표결과)"
        - "NESDC (여론조사)"
        - "data.go.kr OpenAPI / api"
        - "기타 / 모름"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: dropdown
    id: install_method
    attributes:
      label: 설치 방법
      options:
        - Homebrew
        - GitHub Releases (수동 다운로드)
        - From source (make build)
    validations:
      required: true
