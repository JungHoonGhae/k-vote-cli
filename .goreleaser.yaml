# goreleaser config — 단일 정적 Go 바이너리(kvote)용.
# 태그 푸시(vX.Y.Z) 시 GitHub Actions(release.yml)가 실행 → 크로스플랫폼 바이너리 +
# 체크섬 + GitHub Release + Homebrew formula(tap 저장소 푸시)를 한 번에 생성.
version: 2

project_name: k-vote-cli

before:
  hooks:
    - go mod tidy

builds:
  - id: kvote
    main: ./cmd/kvote
    binary: kvote
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/JungHoonGhae/k-vote-cli/internal/version.Version={{ .Version }}
      - -X github.com/JungHoonGhae/k-vote-cli/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/JungHoonGhae/k-vote-cli/internal/version.Date={{ .Date }}

archives:
  - id: kvote
    name_template: "kvote_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: ["zip"]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "Merge "

# Homebrew Cask → tap 저장소(JungHoonGhae/homebrew-k-vote-cli)에 자동 커밋.
# 필요: tap 저장소 + 쓰기 권한 토큰(HOMEBREW_TAP_GITHUB_TOKEN 시크릿).
homebrew_casks:
  - name: kvote
    repository:
      owner: JungHoonGhae
      name: homebrew-k-vote-cli
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/JungHoonGhae/k-vote-cli"
    description: "한국 선거 공개 데이터를 API 키 없이 한 명령으로 — 개표결과·여론조사·투표율. 누구에게나 같은 데이터"
    # 미서명 바이너리의 macOS Gatekeeper 격리 제거 (없으면 첫 실행이 차단됨).
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/kvote"]
          end

release:
  draft: false
  prerelease: auto
